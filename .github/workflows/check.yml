name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux native core and C ABI
            os: ubuntu-24.04
          - name: macOS core, C ABI, app and headless checks
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Zig release
        run: bash scripts/setup-ci-zig.sh

      - name: Select Xcode 26.6
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swiftc --version

      - name: Run native portable tests, C ABI checks and library build
        run: make check-core

      - name: Build the macOS app and run lifecycle, policy, installer and watcher checks
        if: runner.os == 'macOS'
        env:
          WS_CORE_LIBRARY: ${{ github.workspace }}/core/zig-out/lib/libwavesearch.a
          WS_CORE_HEADERS: ${{ github.workspace }}/core/include
        run: make check-macos-headless

      - name: Report desktop checks
        if: always() && runner.os == 'macOS'
        run: |
          echo '### Desktop validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Window chrome and Settings appearance checks are **not run** in hosted CI.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run `make check` in a logged-in macOS desktop session to include them.' >> "$GITHUB_STEP_SUMMARY"
